<head>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: #0b0b0b;
      color: #f5f3ef;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 900px;
      min-height: 100vh;
      margin: auto;
      padding: 55px 40px 45px;

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(255,255,255,0.035),
          transparent 35%
        ),
        #0b0b0b;
    }

    /* TOP TITLE */

    .top-title {
      text-align: center;
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 800;
      letter-spacing: 0.16em;
      line-height: 1.2;
    }

    .dash {
      width: 65px;
      height: 2px;
      background: #d5d3ce;
      margin: 32px auto 125px;
    }

    /* PREMIUM FASHION */

    .eyebrow {
      text-align: center;
      color: #b8b6b1;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.30em;
      margin-bottom: 65px;
    }

    /* BRAND */

    .brand {
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
      font-size: clamp(72px, 13vw, 150px);
      line-height: 0.86;
      letter-spacing: -0.055em;
      margin-bottom: 78px;
    }

    .brand span {
      display: block;
    }

    /* SOCIAL BUTTONS */

    .links {
      display: grid;
      gap: 30px;
    }

    .link {
      min-height: 125px;
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;

      border: 2px solid #363636;
      border-radius: 34px;

      color: #f3f1ed;
      background: rgba(255,255,255,0.005);

      text-decoration: none;

      font-size: clamp(21px, 3vw, 31px);
      font-weight: 700;

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .link:hover {
      transform: translateY(-3px);
      border-color: #777;
      background: rgba(255,255,255,0.035);
    }

    .link:active {
      transform: scale(0.985);
    }

    /* ICONS */

    .icon {
      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex: 0 0 44px;
    }

    .icon svg {
      width: 100%;
      height: 100%;
      display: block;
      fill: currentColor;
    }

    /* FOOTER */

    footer {
      margin-top: 150px;
      padding-top: 50px;

      border-top: 2px solid #333;

      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 30px;
    }

    .footer-brand {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 0.13em;
      line-height: 1.25;
    }

    .footer-sub {
      color: #999;
      font-size: 15px;
      margin-top: 10px;
    }

    .socials {
      display: flex;
      gap: 15px;
    }

    .social {
      width: 65px;
      height: 65px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 2px solid #363636;
      border-radius: 50%;

      color: #eee;
      text-decoration: none;

      transition: 0.2s ease;
    }

    .social:hover {
      border-color: #777;
      transform: translateY(-2px);
    }

    .social svg {
      width: 29px;
      height: 29px;
      fill: currentColor;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .page {
        padding: 30px 18px 35px;
      }

      .top-title {
        font-size: 27px;
      }

      .dash {
        margin-top: 25px;
        margin-bottom: 90px;
      }

      .eyebrow {
        font-size: 13px;
        letter-spacing: 0.25em;
        margin-bottom: 50px;
      }

      .brand {
        font-size: clamp(60px, 18vw, 100px);
        margin-bottom: 60px;
      }

      .links {
        gap: 20px;
      }

      .link {
        min-height: 92px;
        border-radius: 27px;
        gap: 18px;
        font-size: 20px;
      }

      .icon {
        width: 35px;
        height: 35px;
        flex-basis: 35px;
      }

      footer {
        margin-top: 90px;
        padding-top: 35px;
        flex-direction: column;
      }

      .socials {
        width: 100%;
        justify-content: center;
        margin-top: 10px;
      }

      .social {
        width: 57px;
        height: 57px;
      }
    }
  </style>
